name: Deploy

# Runs on a self-hosted runner installed on the Ubuntu server itself (see
# docs/DEPLOYMENT.md) — that's what lets this reach a machine behind a home router with
# no inbound port-forwarding for the deploy mechanism: the runner polls GitHub, GitHub
# never has to reach in.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore .env
        # .env is git-ignored (it holds live secrets) and actions/checkout starts from a
        # clean tree every run, so it never exists in this checkout on its own. It's kept
        # persistently at ~/antiquary/.env (outside this runner's _work tree, so it
        # survives every run's cleanup) — see docs/SERVER_SETUP.md step 8. Copy it in
        # before anything that needs it.
        run: cp "$HOME/antiquary/.env" .env

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build and start containers
        run: |
          docker compose build
          docker compose up -d
        # The `app` service's own startup command already runs `alembic upgrade head`
        # and `flask seed-admin` on every start (idempotent) — no separate migration
        # step needed here.

      - name: Health check
        # --resolve pins the domain to loopback instead of really going out to the
        # internet and back in: this router doesn't support NAT hairpinning, so a plain
        # `curl https://$DOMAIN` from the server itself to its own public domain hangs
        # indefinitely rather than failing (confirmed while setting this up — see
        # docs/SERVER_SETUP.md). --max-time is a second safety net so a single bad
        # attempt can't eat the whole retry budget either way.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/api/health"; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          exit 1
        env:
          DOMAIN: ${{ vars.DOMAIN }}
