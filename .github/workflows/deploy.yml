name: Deploy

# Runs on a self-hosted runner installed on the Ubuntu server itself (see
# docs/DEPLOYMENT.md) — that's what lets this reach a machine behind a home router with
# no inbound port-forwarding for the deploy mechanism: the runner polls GitHub, GitHub
# never has to reach in.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build and start containers
        run: |
          docker compose build
          docker compose up -d
        # The `app` service's own startup command already runs `alembic upgrade head`
        # and `flask seed-admin` on every start (idempotent) — no separate migration
        # step needed here.

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://${DOMAIN}/api/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          exit 1
        env:
          DOMAIN: ${{ vars.DOMAIN }}
