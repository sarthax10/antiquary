services:
  postgres:
    image: postgres:16-alpine
    container_name: antiquary-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No host port published — only `app` talks to this, over the internal
    # compose network (service name `postgres`), which keeps it off the public
    # internet entirely.

  minio:
    image: minio/minio:latest
    container_name: antiquary-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    # Same reasoning as postgres: no host port published. If you want the MinIO
    # console for manual inspection, temporarily add "9001:9001" and remove it
    # again afterward rather than leaving object storage admin exposed.

  ollama:
    image: ollama/ollama:latest
    container_name: antiquary-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot: pulls the model into the `ollama` service's volume if it isn't already
  # there, then exits. This is the "install step" for the model itself — the base
  # ollama/ollama image ships with no models, and `app` waits on this completing
  # successfully before it starts, so a fresh `docker compose up -d` is genuinely
  # everything-included with no manual `ollama pull` step required.
  ollama-init:
    image: ollama/ollama:latest
    container_name: antiquary-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      - ollama
    restart: "no"

  app:
    build:
      context: .
      # Installs pipeline/illustrate.py's GPU illustration stack (torch/diffusers —
      # see OPEN_ISSUES.md #61) into the image. This host's NVIDIA GPU (RTX 3060) is
      # real and Docker GPU passthrough works from an interactive `docker`/`docker
      # compose` shell (verified directly) — but a real deploy through this project's
      # GitHub Actions self-hosted runner FAILED twice with "could not select device
      # driver nvidia" even though nothing else about the host changed, meaning the
      # runner's own Docker invocation doesn't have the same GPU access an interactive
      # session does (root cause not yet identified — a runner-service-configuration
      # question, not something fixable from inside this repo). So there is
      # deliberately NO `deploy.resources.reservations.devices` GPU reservation here
      # any more: that was a HARD requirement Compose enforces at container-start time,
      # and it took production down (failed to start the app container at all) the
      # moment a real deploy hit it. Leaving WITH_GPU_ILLUSTRATION on so the image still
      # carries the dependencies is safe either way: illustrate.py's own runtime check
      # (`torch.cuda.is_available()`) correctly returns False with no device attached,
      # and the app falls back to the 2D motion-graphics illustrated mode automatically
      # — exactly the graceful-degradation path this feature was built around. Real GPU
      # generation only runs today via a manual `docker compose up -d app` from an
      # interactive shell where passthrough is confirmed working, not through normal
      # deploys, until the runner's own GPU access is sorted out.
      args:
        WITH_GPU_ILLUSTRATION: "true"
    container_name: antiquary-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head &&
             flask --app wsgi seed-admin &&
             flask --app wsgi ensure-bucket &&
             gunicorn wsgi:app --bind 0.0.0.0:8787 --workers 1 --worker-class gthread --threads 4 --timeout 180"
    restart: unless-stopped
    # No host port published — Caddy is the only public entry point.

  caddy:
    image: caddy:2-alpine
    container_name: antiquary-caddy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - netdata
    restart: unless-stopped

  # Server + per-container resource metrics (CPU/RAM/disk/network), zero-config —
  # simplified stand-in for a full Grafana/Prometheus stack, appropriate for a single
  # box. No Netdata Cloud integration (no claim token set) — purely local, matches the
  # project's self-hosted/free constraint. Reachable at /stats behind Basic Auth via
  # Caddy, not published as a host port itself (same "Caddy is the only public entry
  # point" pattern as every other service here).
  netdata:
    image: netdata/netdata:latest
    container_name: antiquary-netdata
    hostname: reliquary
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  media_data:
  caddy_data:
  caddy_config:
  netdata_config:
  netdata_lib:
  netdata_cache:
